<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:dark;--red:#ff405f;--red2:#a10f2b;--ink:#09090c;--line:#34202a;--muted:#aaa4b0}
*{box-sizing:border-box}body{margin:0;background:transparent;color:#f6f3f6;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.panel{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 10px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(120deg,rgba(161,15,43,.18),rgba(8,8,11,.97) 62%);box-shadow:0 8px 26px #0003}
button{border:1px solid #4a2732;border-radius:999px;background:#171116;color:#f8f5f7;padding:10px 14px;font-weight:650;font-size:13px;cursor:pointer;white-space:nowrap}button:focus-visible{outline:2px solid var(--red);outline-offset:2px}.mic{width:42px;height:42px;padding:0;font-size:18px;display:grid;place-items:center;background:linear-gradient(135deg,#ff526b,#8d0a26);border:0;box-shadow:0 0 18px #ff405f30}.mic.recording{animation:pulse 1.1s infinite}.status{font-size:12px;color:var(--muted);min-width:105px}.status strong{color:#ff7185}.wave{height:30px;display:flex;align-items:center;justify-content:center;gap:3px;flex:1;min-width:40px;overflow:hidden}.bar{width:3px;height:5px;border-radius:5px;background:linear-gradient(180deg,#ff8798,#b20d31);opacity:.45}.recording .bar{opacity:1;animation:wave .65s ease-in-out infinite alternate}.bar:nth-child(3n){animation-delay:-.3s}.bar:nth-child(4n){animation-delay:-.48s}.bar:nth-child(5n){animation-delay:-.18s}.send{background:linear-gradient(135deg,#ff526b,#a10f2b);border:0;color:white}.send:disabled{opacity:.4;cursor:not-allowed}.hint{font-size:10px;color:#817985;margin:5px 4px 0;line-height:1.35}
@keyframes wave{from{height:4px}to{height:26px}}@keyframes pulse{50%{box-shadow:0 0 0 7px #ff405f18,0 0 24px #ff405f55}}
@media(max-width:480px){.panel{gap:7px;padding:7px}.status{min-width:78px;font-size:11px}.status .long{display:none}button{padding:9px 10px;font-size:12px}.mic{width:40px;height:40px}}
</style>
</head>
<body>
<div class="panel" id="panel">
  <button class="mic" id="mic" aria-label="Start voice input" title="Start voice input">🎙</button>
  <div class="status" id="status">Tap mic to <strong>talk</strong></div>
  <div class="wave" id="wave" aria-hidden="true"></div>
  <button id="send" class="send" disabled>Send voice ↑</button>
</div>
<div class="hint">Voice input uses your browser's speech recognition. Tap Send voice anytime to stop and submit the words recognized so far.</div>
<script>
(function(){
  const parent = window.parent;
  const mic = document.getElementById('mic'), send = document.getElementById('send');
  const status = document.getElementById('status'), panel = document.getElementById('panel'), wave = document.getElementById('wave');
  for(let i=0;i<36;i++){const b=document.createElement('span');b.className='bar';wave.appendChild(b)}
  let recognition=null, listening=false, finalText='', interimText='', sent=false;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  function resize(){try{parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:94},'*')}catch(e){}}
  function setValue(value){try{parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:value,dataType:'json'},'*')}catch(e){}}
  function paint(){const words=(finalText+' '+interimText).trim();send.disabled=!words;status.innerHTML=listening?'<strong>Listening…</strong> speak naturally':words?'Ready to send voice':'Tap mic to <strong>talk</strong>';panel.classList.toggle('recording',listening);mic.classList.toggle('recording',listening);mic.setAttribute('aria-label',listening?'Stop recording':'Start voice input');}
  function stopAndSend(){if(sent)return;sent=true;listening=false;try{if(recognition)recognition.stop()}catch(e){}const transcript=(finalText+' '+interimText).replace(/\s+/g,' ').trim();paint();if(transcript){status.textContent='Sending transcript…';setValue({action:'submit',transcript:transcript,nonce:Date.now()})}else{status.textContent='No speech recognized';sent=false;}}
  mic.addEventListener('click',()=>{
    if(listening){try{recognition.stop()}catch(e){}listening=false;paint();return}
    if(!SR){status.textContent='Speech recognition unavailable';return}
    finalText='';interimText='';sent=false;
    try{recognition=new SR();recognition.lang=navigator.language||'en-IN';recognition.continuous=true;recognition.interimResults=true;
      recognition.onstart=()=>{listening=true;paint()};
      recognition.onresult=(event)=>{interimText='';for(let i=event.resultIndex;i<event.results.length;i++){const text=event.results[i][0].transcript;if(event.results[i].isFinal)finalText+=' '+text;else interimText+=' '+text}paint()};
      recognition.onerror=(event)=>{listening=false;status.textContent=event.error==='not-allowed'?'Allow microphone access in browser settings':'Voice error: '+event.error;paint()};
      recognition.onend=()=>{listening=false;paint();if(sent)return};
      recognition.start();
    }catch(e){status.textContent='Could not start microphone';listening=false;paint()}
  });
  send.addEventListener('click',stopAndSend);
  window.addEventListener('load',resize);resize();paint();
})();
</script>
</body>
</html>
